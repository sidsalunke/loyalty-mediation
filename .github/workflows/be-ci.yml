name: BE CI

# ── Trigger ───────────────────────────────────────────────────────────────────
# Runs on every PR targeting master/main.
#
# What runs:
#   mediation-service unit + component tests via RestAssured + WireMock.
#   The vendor API is stubbed by WireMock — no external services needed.
#   Solace is disabled via the "test" Spring profile.
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  be-ci:
    name: BE CI Tests (WireMock vendor stub)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # Run only the mediation-service module.
      # vendor-mock has no tests of its own yet.
      - name: Run mediation-service tests
        run: mvn test -pl mediation-service --no-transfer-progress

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: mediation-service/target/surefire-reports/
          retention-days: 14

      # Publish test results as a PR check so failures surface inline.
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: mediation-service/target/surefire-reports/TEST-*.xml
          check_name: BE CI — Test Results
          comment_mode: always
